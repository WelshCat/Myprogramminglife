name: Week Alarm APK

on:
  push:
    paths: ["alarm/**", ".github/workflows/alarm.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease lint
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: week-alarm-apk
          path: alarm/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-alarm-lint
          path: alarm/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
      # 네트워크가 막힌 환경에서도 로그로 APK를 받을 수 있도록 base64로 출력 (sha256으로 검증)
      - name: Print release APK as base64
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "-----BEGIN APK-----"
          base64 -w 100 "$APK"
          echo "-----END APK-----"
