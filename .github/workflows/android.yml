name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest 러너에는 Android SDK가 미리 설치되어 있다 (ANDROID_HOME)
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease assembleDebug lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samsung-tv-remote-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      # 네트워크가 막힌 환경에서도 로그로 APK를 받을 수 있도록 base64로 출력 (sha256으로 검증)
      - name: Print release APK as base64
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "-----BEGIN APK-----"
          base64 -w 100 "$APK"
          echo "-----END APK-----"
